[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
dotenvy = "=0.15.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "=0.7.1", features = ["cors"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
